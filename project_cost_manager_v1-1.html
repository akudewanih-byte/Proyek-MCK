<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Cost Manager V1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#17202a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px} header small{opacity:.75}
.container{max-width:1100px;margin:auto;padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:700}
.primary{background:#1677ff;color:#fff}.danger{background:#e74c3c;color:#fff}.secondary{background:#fff;border:1px solid #d7dce0}
.project-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:13px;padding:15px;box-shadow:0 2px 10px #0000000b;border:1px solid #e5e8eb}
.project-card{cursor:pointer}.project-card h3{margin:0 0 8px}.amount{font-size:20px;font-weight:800}.muted{color:#68727d;font-size:13px}
#detail{display:none}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.summary .card strong{display:block;font-size:18px;margin-top:6px}
.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 10px}
.table-wrap{overflow:auto;background:#fff;border-radius:12px;border:1px solid #e2e6ea}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px}th{background:#f8f9fa}
input,select{width:100%;padding:9px;border:1px solid #ccd2d8;border-radius:7px;background:#fff}
.add-row{margin-top:9px}
.total-row{font-weight:800;background:#fafafa}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:min(430px,100%)}.modal-box h2{margin-top:0}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.empty{text-align:center;padding:30px;color:#77818a}
@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.container{padding:10px}header{padding:14px 12px}}
</style>
</head>
<body>
<header><h1>Project Cost Manager</h1><small>V1 • Material • Upah • BOP</small></header>
<div class="container">
  <div id="home">
    <div class="toolbar">
      <button class="primary" onclick="openProjectModal()">+ Tambah Proyek</button>
    </div>
    <div id="projectList" class="project-list"></div>
  </div>

  <div id="detail">
    <div class="topline">
      <div>
        <button class="secondary" onclick="showHome()">← Kembali</button>
        <h2 id="projectTitle" style="display:inline-block;margin-left:8px"></h2>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="secondary" onclick="exportExcel()">📊 Export Excel</button>
        <button class="secondary" onclick="exportPDF()">📄 Export PDF</button>
        <button class="danger" onclick="deleteCurrentProject()">Hapus Proyek</button>
      </div>
    </div>

    <div class="summary">
      <div class="card"><span class="muted">Material</span><strong id="sumMaterial">Rp0</strong></div>
      <div class="card"><span class="muted">Upah</span><strong id="sumUpah">Rp0</strong></div>
      <div class="card"><span class="muted">BOP</span><strong id="sumBop">Rp0</strong></div>
      <div class="card"><span class="muted">TOTAL HPP</span><strong id="sumTotal">Rp0</strong></div>
    </div>

    <div class="section">
      <h2>1. MATERIAL</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <input id="materialFilter" oninput="renderMaterial()" placeholder="🔎 Cari nama material atau jenis..." style="max-width:360px">
        <button class="secondary" onclick="clearMaterialFilter()">Reset Filter</button>
      </div>
      <div id="materialTable"></div>
    </div>
    <div class="section"><h2>2. UPAH</h2><div id="upahTable"></div></div>
    <div class="section"><h2>3. BOP</h2><div id="bopTable"></div></div>
  </div>
</div>

<div class="modal" id="projectModal">
  <div class="modal-box">
    <h2>Tambah Proyek</h2>
    <label>Nama Proyek</label>
    <input id="projectName" placeholder="Contoh: Proyek JISC Purwakarta">
    <div class="modal-actions">
      <button class="secondary" onclick="closeProjectModal()">Batal</button>
      <button class="primary" onclick="createProject()">Simpan</button>
    </div>
  </div>
</div>

<script>
const KEY='pcm_v1_data';
let data=JSON.parse(localStorage.getItem(KEY)||'{"projects":[]}');
let currentId=null;

const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function project(){return data.projects.find(p=>p.id===currentId)}

function renderHome(){
 document.getElementById('home').style.display='block';
 document.getElementById('detail').style.display='none';
 const box=document.getElementById('projectList');
 if(!data.projects.length){box.innerHTML='<div class="card empty">Belum ada proyek.<br>Klik <b>+ Tambah Proyek</b> untuk mulai.</div>';return}
 box.innerHTML=data.projects.map(p=>{
   const total=calc(p.material)+calc(p.upah)+calc(p.bop);
   return `<div class="card project-card" onclick="openProject('${p.id}')">
    <h3>${esc(p.name)}</h3><div class="muted">${p.material.length} material • ${p.upah.length} item upah • ${p.bop.length} BOP</div>
    <div class="amount">${rupiah(total)}</div><div class="muted">Total HPP</div>
   </div>`
 }).join('');
}
function calc(rows){return rows.reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.price)||0),0)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function openProjectModal(){document.getElementById('projectModal').style.display='flex';document.getElementById('projectName').focus()}
function closeProjectModal(){document.getElementById('projectModal').style.display='none';document.getElementById('projectName').value=''}
function createProject(){
 const name=document.getElementById('projectName').value.trim()||`Proyek ${data.projects.length+1}`;
 const p={id:Date.now().toString(),name,material:[],upah:[],bop:[]};
 data.projects.push(p);save();closeProjectModal();openProject(p.id);
}
function openProject(id){
 currentId=id;const p=project();
 document.getElementById('home').style.display='none';document.getElementById('detail').style.display='block';
 document.getElementById('projectTitle').textContent=p.name;
 renderDetail();
}
function showHome(){currentId=null;renderHome()}
function deleteCurrentProject(){
 if(confirm('Hapus proyek ini beserta seluruh datanya?')){
  data.projects=data.projects.filter(p=>p.id!==currentId);save();showHome();
 }
}
function addRow(type){
 const p=project();p[type].push({name:'',kind:'',qty:1,unit:'',price:0});save();renderDetail();
}
function updateRow(type,i,field,val){
 const p=project();p[type][i][field]=field==='qty'||field==='price'?Number(val):val;save();renderDetail();
}
function deleteRow(type,i){project()[type].splice(i,1);save();renderDetail()}

function table(type,label){
 const rows=project()[type];
 let h=`<div class="table-wrap"><table><thead><tr>
 <th>Nama ${label}</th><th>Jenis</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total</th><th></th>
 </tr></thead><tbody>`;
 rows.forEach((r,i)=>{
  const total=(Number(r.qty)||0)*(Number(r.price)||0);
  h+=`<tr>
  <td><input value="${esc(r.name)}" onchange="updateRow('${type}',${i},'name',this.value)"></td>
  <td><input value="${esc(r.kind)}" onchange="updateRow('${type}',${i},'kind',this.value)" placeholder="Contoh: Semen"></td>
  <td><input type="number" min="0" value="${r.qty}" onchange="updateRow('${type}',${i},'qty',this.value)"></td>
  <td><input value="${esc(r.unit)}" onchange="updateRow('${type}',${i},'unit',this.value)" placeholder="sak / hari / m3"></td>
  <td><input type="number" min="0" value="${r.price}" onchange="updateRow('${type}',${i},'price',this.value)"></td>
  <td><b>${rupiah(total)}</b></td>
  <td><button class="danger" onclick="deleteRow('${type}',${i})">×</button></td>
  </tr>`;
 });
 h+=`<tr class="total-row"><td colspan="5">TOTAL ${label.toUpperCase()}</td><td>${rupiah(calc(rows))}</td><td></td></tr>`;
 h+=`</tbody></table></div><button class="secondary add-row" onclick="addRow('${type}')">+ Tambah ${label}</button>`;
 return h;
}

function renderMaterial(){
 const q=(document.getElementById('materialFilter')?.value||'').toLowerCase().trim();
 const p=project();
 const filtered=p.material.map((r,i)=>({r,i})).filter(x=>
   !q || String(x.r.name).toLowerCase().includes(q) || String(x.r.kind).toLowerCase().includes(q)
 );
 let h=`<div class="table-wrap"><table><thead><tr>
 <th>Nama Material</th><th>Jenis</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total</th><th></th>
 </tr></thead><tbody>`;
 filtered.forEach(({r,i})=>{
   const total=(Number(r.qty)||0)*(Number(r.price)||0);
   h+=`<tr>
   <td><input value="${esc(r.name)}" onchange="updateRow('material',${i},'name',this.value)"></td>
   <td><input value="${esc(r.kind)}" onchange="updateRow('material',${i},'kind',this.value)" placeholder="Contoh: Semen"></td>
   <td><input type="number" min="0" value="${r.qty}" onchange="updateRow('material',${i},'qty',this.value)"></td>
   <td><input value="${esc(r.unit)}" onchange="updateRow('material',${i},'unit',this.value)"></td>
   <td><input type="number" min="0" value="${r.price}" onchange="updateRow('material',${i},'price',this.value)"></td>
   <td><b>${rupiah(total)}</b></td>
   <td><button class="danger" onclick="deleteRow('material',${i})">×</button></td></tr>`;
 });
 h+=`<tr class="total-row"><td colspan="5">TOTAL MATERIAL${q?' (HASIL FILTER)':''}</td><td>${rupiah(filtered.reduce((a,x)=>a+(Number(x.r.qty)||0)*(Number(x.r.price)||0),0))}</td><td></td></tr></tbody></table></div>
 <button class="secondary add-row" onclick="addRow('material')">+ Tambah Material</button>`;
 document.getElementById('materialTable').innerHTML=h;
}
function clearMaterialFilter(){
 const el=document.getElementById('materialFilter'); if(el) el.value=''; renderMaterial();
}

function csvCell(v){
 const x=String(v??'').replace(/"/g,'""'); return `"${x}"`;
}
function exportExcel(){
 const p=project(); if(!p)return;
 let rows=[['PROJECT COST MANAGER',p.name],[],['MATERIAL','Nama Material','Jenis','Qty','Satuan','Harga Satuan','Total']];
 p.material.forEach(r=>rows.push(['',r.name,r.kind,r.qty,r.unit,r.price,(r.qty||0)*(r.price||0)]));
 rows.push([],['UPAH','Nama Pekerjaan','Jenis','Qty','Satuan','Harga Satuan','Total']);
 p.upah.forEach(r=>rows.push(['',r.name,r.kind,r.qty,r.unit,r.price,(r.qty||0)*(r.price||0)]));
 rows.push([],['BOP','Nama Biaya','Jenis','Qty','Satuan','Harga Satuan','Total']);
 p.bop.forEach(r=>rows.push(['',r.name,r.kind,r.qty,r.unit,r.price,(r.qty||0)*(r.price||0)]));
 rows.push([],['RINGKASAN','Material',calc(p.material)],['','Upah',calc(p.upah)],['','BOP',calc(p.bop)],['','TOTAL HPP',calc(p.material)+calc(p.upah)+calc(p.bop)]);
 const csv='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=(p.name||'proyek').replace(/[^\w\-]+/g,'_')+'_cost.csv';a.click();URL.revokeObjectURL(a.href);
}
function exportPDF(){
 const p=project(); if(!p)return;
 const win=window.open('','_blank');
 const rows=(title,arr)=>`<h3>${title}</h3><table><tr><th>Nama</th><th>Jenis</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total</th></tr>`+
 arr.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${r.qty}</td><td>${esc(r.unit)}</td><td>${rupiah(r.price)}</td><td>${rupiah((r.qty||0)*(r.price||0))}</td></tr>`).join('')+
 `<tr><th colspan="5">TOTAL ${title}</th><th>${rupiah(calc(arr))}</th></tr></table>`;
 win.document.write(`<html><head><title>${esc(p.name)}</title><style>
 body{font-family:Arial;padding:25px;color:#111}h1{font-size:22px}h3{margin-top:25px}
 table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #aaa;padding:6px;text-align:left}th{background:#eee}
 .summary{margin-top:25px;width:350px}.summary td,.summary th{font-size:13px}
 </style></head><body><h1>PROJECT COST MANAGER</h1><h2>${esc(p.name)}</h2>
 ${rows('MATERIAL',p.material)}${rows('UPAH',p.upah)}${rows('BOP',p.bop)}
 <table class="summary"><tr><th>Material</th><td>${rupiah(calc(p.material))}</td></tr>
 <tr><th>Upah</th><td>${rupiah(calc(p.upah))}</td></tr><tr><th>BOP</th><td>${rupiah(calc(p.bop))}</td></tr>
 <tr><th>TOTAL HPP</th><th>${rupiah(calc(p.material)+calc(p.upah)+calc(p.bop))}</th></tr></table>
 <script>window.onload=()=>window.print()<\/script></body></html>`);
 win.document.close();
}

function renderDetail(){
 const p=project();
 renderMaterial();
 document.getElementById('upahTable').innerHTML=table('upah','Upah');
 document.getElementById('bopTable').innerHTML=table('bop','BOP');
 const a=calc(p.material),b=calc(p.upah),c=calc(p.bop);
 document.getElementById('sumMaterial').textContent=rupiah(a);
 document.getElementById('sumUpah').textContent=rupiah(b);
 document.getElementById('sumBop').textContent=rupiah(c);
 document.getElementById('sumTotal').textContent=rupiah(a+b+c);
}
renderHome();
</script>
</body>
</html>
