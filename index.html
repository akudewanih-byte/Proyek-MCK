<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Cost Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:auto;padding:16px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;background:#2563eb;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}.back{background:#374151}
h1{font-size:22px;margin:0}h2{margin:6px 0 16px}.muted{color:#6b7280}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px #00000012}
.card:hover{box-shadow:0 4px 15px #0002}.project-title{font-size:18px;font-weight:700}.money{font-weight:700;font-size:20px;margin:8px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:180px}
input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;font-size:13px;vertical-align:middle}th{background:#f3f4f6}
.table-wrap{overflow:auto;border-radius:10px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.summary .card{padding:12px}.summary b{display:block;margin-top:5px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-box{background:#fff;padding:20px;border-radius:12px;width:min(420px,100%)}
.print-only{display:none}
@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}th,td{white-space:nowrap}.head{align-items:flex-start}.head button{padding:8px}}
@media print{header,.toolbar,.no-print,button{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none}.print-only{display:block}}
</style>
</head>
<body>
<header><div class="head"><h1>Project Cost Manager</h1><button id="addBtn">+ Tambah Proyek</button></div></header>
<div class="wrap" id="app"></div>

<div class="modal" id="modal"><div class="modal-box">
<h2>Tambah Proyek</h2><input id="projectName" placeholder="Nama proyek">
<div style="height:10px"></div><div style="display:flex;gap:8px"><button onclick="createProject()">Simpan</button><button class="secondary" onclick="closeModal()">Batal</button></div>
</div></div>

<script>
const KEY='pcm_v1_data';
let data=JSON.parse(localStorage.getItem(KEY)||'{"projects":[]}');
let currentId=null, filter='';
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const proj=()=>data.projects.find(x=>x.id===currentId);
const total=rows=>(rows||[]).reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.price)||0),0);

document.getElementById('addBtn').onclick=()=>{document.getElementById('modal').style.display='flex';document.getElementById('projectName').value='';document.getElementById('projectName').focus()};
function closeModal(){document.getElementById('modal').style.display='none'}
function createProject(){let n=document.getElementById('projectName').value.trim();if(!n)return alert('Isi nama proyek');let p={id:Date.now(),name:n,material:[],upah:[],bop:[]};data.projects.push(p);save();closeModal();openProject(p.id)}
function showHome(){currentId=null;renderHome()}
function openProject(id){currentId=id;filter='';renderDetail()}
function deleteProject(){if(!confirm('Hapus proyek ini?'))return;data.projects=data.projects.filter(x=>x.id!==currentId);save();showHome()}
function addRow(type){let p=proj();p[type].push({name:'',kind:'',qty:1,unit:'',price:0});save();renderDetail()}
function updateDraft(type,i,key,val){
 const r=proj()[type][i];
 r._draft=r._draft||{};
 r._draft[key]=(key==='qty'||key==='price')?(Number(val)||0):val;
}
function saveRow(type,i){
 const r=proj()[type][i];
 if(r._draft){Object.assign(r,r._draft);delete r._draft;}
 save();renderDetail();
}
function cancelDraft(type,i){
 const r=proj()[type][i];
 if(r._draft) delete r._draft;
 renderDetail();
}
function delRow(type,i){proj()[type].splice(i,1);save();renderDetail()}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCSV(){
 let p=proj();let rows=[['PROJECT COST MANAGER',p.name],[],['Kategori','Nama','Jenis','Qty','Satuan','Harga Satuan','Total']];
 [['Material',p.material],['Upah',p.upah],['BOP',p.bop]].forEach(([cat,arr])=>arr.forEach(r=>rows.push([cat,r.name,r.kind,r.qty,r.unit,r.price,(r.qty||0)*(r.price||0)])));
 rows.push([],['TOTAL MATERIAL','','','','','',total(p.material)],['TOTAL UPAH','','','','','',total(p.upah)],['TOTAL BOP','','','','','',total(p.bop)],['TOTAL HPP','','','','','',total(p.material)+total(p.upah)+total(p.bop)]);
 let csv=rows.map(r=>r.map(csvEscape).join(',')).join('\\r\\n');
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=p.name.replace(/[^a-z0-9]/gi,'_')+'.csv';a.click();URL.revokeObjectURL(a.href)
}
function printPDF(){window.print()}

function inputCell(type,i,key,val){
 const r=proj()[type][i];
 const v=(r._draft && r._draft[key]!==undefined)?r._draft[key]:val;
 return `<input value="${String(v??'').replaceAll('"','&quot;')}" onchange="updateDraft('${type}',${i},'${key}',this.value)">`;
}
function table(type,label){
 let p=proj(), arr=p[type];
 let body=arr.map((r,i)=>{return `<tr>
<td>${inputCell(type,i,'name',r.name)}</td>
<td>${inputCell(type,i,'kind',r.kind)}</td>
<td style="min-width:80px">${inputCell(type,i,'qty',r.qty)}</td>
<td>${inputCell(type,i,'unit',r.unit)}</td>
<td style="min-width:130px">${inputCell(type,i,'price',r.price)}</td>
<td>${rupiah(((r._draft?.qty??r.qty)||0)*((r._draft?.price??r.price)||0))}</td>
<td style="display:flex;gap:5px">
<button onclick="saveRow('${type}',${i})">Simpan</button>
<button class="secondary" onclick="cancelDraft('${type}',${i})">Batal</button>
<button class="danger" onclick="delRow('${type}',${i})">Hapus</button>
</td></tr>`}).join('');
 return `<div class="section"><div class="section-head"><h2>${label}</h2><button onclick="addRow('${type}')">+ Tambah</button></div>
 <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Jenis</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${body||'<tr><td colspan="7" class="muted">Belum ada data.</td></tr>'}</tbody></table></div></div>`
}
function renderHome(){
 document.getElementById('app').innerHTML=`<div class="toolbar"><button onclick="document.getElementById('addBtn').click()">+ Tambah Proyek</button></div>
 <div class="cards">${data.projects.map(p=>{let t=total(p.material)+total(p.upah)+total(p.bop);return `<div class="card"><div class="project-title">${p.name}</div><div class="muted">Material ${p.material.length} • Upah ${p.upah.length} • BOP ${p.bop.length}</div><div class="money">${rupiah(t)}</div><button onclick="openProject(${p.id})">Buka Proyek</button></div>`}).join('')||'<div class="card">Belum ada proyek. Tekan + Tambah Proyek.</div>'}</div>`
}
function renderDetail(){
 let p=proj();if(!p)return renderHome();
 let m=total(p.material),u=total(p.upah),b=total(p.bop);
 const q=filter.toLowerCase().trim();
 const match=r=>(r.name+' '+r.kind+' '+r.unit).toLowerCase().includes(q);
 const old=table;
 function filteredTable(type,label){
   let arr=p[type], shown=q?arr.filter(match):arr;
   let body=shown.map(r=>{
     let i=arr.indexOf(r);
     return `<tr>
<td>${inputCell(type,i,'name',r.name)}</td><td>${inputCell(type,i,'kind',r.kind)}</td>
<td style="min-width:80px">${inputCell(type,i,'qty',r.qty)}</td><td>${inputCell(type,i,'unit',r.unit)}</td>
<td style="min-width:130px">${inputCell(type,i,'price',r.price)}</td>
<td>${rupiah(((r._draft?.qty??r.qty)||0)*((r._draft?.price??r.price)||0))}</td>
<td style="display:flex;gap:5px"><button onclick="saveRow('${type}',${i})">Simpan</button><button class="secondary" onclick="cancelDraft('${type}',${i})">Batal</button><button class="danger" onclick="delRow('${type}',${i})">Hapus</button></td>
</tr>`;
   }).join('');
   return `<div class="section"><div class="section-head"><h2>${label}</h2><button onclick="addRow('${type}')">+ Tambah</button></div>
   <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Jenis</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${body||'<tr><td colspan="7" class="muted">Tidak ada data yang cocok.</td></tr>'}</tbody></table></div></div>`;
 }
 document.getElementById('app').innerHTML=`<div class="toolbar no-print"><button class="back" onclick="showHome()">← Daftar Proyek</button><input style="flex:1;min-width:220px" placeholder="🔎 Filter Material, Upah & BOP..." value="${filter.replaceAll('"','&quot;')}" oninput="filter=this.value;renderDetail()"><button class="secondary" onclick="filter='';renderDetail()">Reset</button><button onclick="exportCSV()">Export Excel/CSV</button><button onclick="printPDF()">Cetak / Simpan PDF</button><button class="danger" onclick="deleteProject()">Hapus Proyek</button></div>
 <h2>${p.name}</h2>
 <div class="summary"><div class="card">Material<b>${rupiah(m)}</b></div><div class="card">Upah<b>${rupiah(u)}</b></div><div class="card">BOP<b>${rupiah(b)}</b></div><div class="card">TOTAL HPP<b>${rupiah(m+u+b)}</b></div></div>
 ${filteredTable('material','Material')}${filteredTable('upah','Upah')}${filteredTable('bop','BOP')}
 <p class="print-only">Dicetak dari Project Cost Manager — ${new Date().toLocaleString('id-ID')}</p>`;
}
renderHome();let m=total(p.material),u=total(p.upah),b=total(p.bop);
 document.getElementById('app').innerHTML=`<div class="toolbar no-print"><button class="back" onclick="showHome()">← Daftar Proyek</button><button onclick="exportCSV()">Export Excel/CSV</button><button onclick="printPDF()">Cetak / Simpan PDF</button><button class="danger" onclick="deleteProject()">Hapus Proyek</button></div>
 <h2>${p.name}</h2><div class="summary"><div class="card">Material<b>${rupiah(m)}</b></div><div class="card">Upah<b>${rupiah(u)}</b></div><div class="card">BOP<b>${rupiah(b)}</b></div><div class="card">TOTAL HPP<b>${rupiah(m+u+b)}</b></div></div>
 ${table('material','Material')}${table('upah','Upah')}${table('bop','BOP')}
 <p class="print-only">Dicetak dari Project Cost Manager — ${new Date().toLocaleString('id-ID')}</p>`;
}
renderHome();
</script>
</body></html>
